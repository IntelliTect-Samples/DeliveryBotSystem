name: Deploy customer webapp to Azure

on:
  push:
    branches:
      - main
      - customer-map
    paths:
      - "frontend/customer-webapp/**"
      - ".github/workflows/deploy-customer-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy customer webapp
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/customer-webapp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/customer-webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint customer webapp
        run: npm run lint

      - name: Build customer webapp
        run: npm run build
        env:
          VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL }}
          VITE_SIMULATOR_API_BASE: ${{ vars.VITE_SIMULATOR_API_BASE }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/customer-webapp/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
