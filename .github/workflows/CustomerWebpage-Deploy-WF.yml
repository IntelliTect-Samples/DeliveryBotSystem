name: CustomerWebpage-Deploy-WF

on:
  push:
    branches:
      - main
    paths:
      - "frontend/customer-webapp/**"
      - ".github/workflows/CustomerWebpage-Deploy-WF.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/customer-webapp/**"
      - ".github/workflows/CustomerWebpage-Deploy-WF.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/customer-webapp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          VITE_API_MANAGEMENT_BASE_URL: ${{ vars.VITE_API_MANAGEMENT_BASE_URL }}
          VITE_AGENT_API_URL: ${{ vars.VITE_AGENT_API_URL }}
          VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL }}
          VITE_ORDER_SERVICE_URL: ${{ vars.VITE_ORDER_SERVICE_URL }}
          VITE_OSRM_API_URL: ${{ vars.VITE_OSRM_API_URL }}
          VITE_SIMULATOR_API_BASE: ${{ vars.VITE_SIMULATOR_API_BASE }}

      - name: Azure Login
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.CUSTOMER_FRONTEND_APP_SERVICE_NAME || 'WA-DeliveryBot-dev' }}
          package: frontend/customer-webapp/dist
