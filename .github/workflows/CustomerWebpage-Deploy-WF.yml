name: CustomerWebpage-Deploy-WF

on:
  push:
    branches:
      - main
    paths:
      - "frontend/customer-webapp/**"
      - ".github/workflows/CustomerWebpage-Deploy-WF.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/customer-webapp/**"
      - ".github/workflows/CustomerWebpage-Deploy-WF.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-agent-service:
    runs-on: ubuntu-latest
    environment: Development

    env:
      RESOURCE_GROUP: ewu-deliverybotsystem-rg
      ACR_NAME: DeliverybotCR
      ACR_LOGIN_SERVER: deliverybotcr.azurecr.io
      CONTAINER_APP_NAME: deliverybot-agent-service
      IMAGE_NAME: agentservice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run backend checks
        run: |
          dotnet build AgentService/AgentService/AgentService.csproj --configuration Release
          dotnet test AgentService/AgentService.Tests/AgentService.Tests.csproj --configuration Release --no-build

      - name: Azure Login
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          IMAGE_TAG="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -f AgentService/AgentService/Dockerfile AgentService
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Update Container App image
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_TAG"

      - name: Print deployment URL
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Agent Service live at: https://${FQDN}"
          echo "POST https://${FQDN}/api/agent/chat"

  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Development

    defaults:
      run:
        working-directory: frontend/customer-webapp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          VITE_AGENT_API_URL: https://deliverybot-agent-service.mangocoast-332176b0.westus2.azurecontainerapps.io/api/agent
          VITE_MAP_TILE_URL: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
          VITE_ORDER_SERVICE_URL: ${{ secrets.VITE_ORDER_SERVICE_API_BASE }}
          VITE_OSRM_API_URL: https://router.project-osrm.org
          VITE_SIMULATOR_API_BASE: ${{ secrets.VITE_SIMULATOR_API_BASE }}

      - name: Azure Login
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: azure/webapps-deploy@v3
        with:
          app-name: WA-DeliveryBot-dev
          package: frontend/customer-webapp/dist
